name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node のバージョンは package.json の engines.node を参照する。
      # Vercel も同じ値を見るため、CI と本番でずれない。
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: ビルド
        run: npm run build
